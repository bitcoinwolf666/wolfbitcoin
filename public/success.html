<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Success</title>
    <style>
      body{margin:0; font-family:system-ui; background:#0b0f17; color:#fff; display:grid; place-items:center; height:100vh;}
      .card{max-width:520px; padding:22px; border:1px solid rgba(255,255,255,0.12); border-radius:16px; background:rgba(255,255,255,0.04);}
      button{margin-top:12px; background:#1c2433; border:1px solid rgba(255,255,255,0.12); color:#fff; padding:10px 12px; border-radius:10px; cursor:pointer;}
    </style>
  </head>
  <body>
    <div class="card">
      <h2>✅ Payment successful</h2>
      <p id="status">Verifying…</p>
      <button id="back">Go to Game</button>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const session_id = params.get("session_id");

      const STORAGE_KEY = "wolfrun_entitlements";
      const getEnt = () => JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      const setEnt = (o) => localStorage.setItem(STORAGE_KEY, JSON.stringify(o));

      async function verify() {
        if (!session_id) {
          document.getElementById("status").textContent = "Missing session id.";
          return;
        }
        const res = await fetch(`/verify-session?session_id=${encodeURIComponent(session_id)}`);
        const data = await res.json();
        if (data.paid) {
          const ent = getEnt();
          ent.premium = true;
          setEnt(ent);
          document.getElementById("status").textContent = "Premium unlocked! 🎉";
        } else {
          document.getElementById("status").textContent = "Payment not confirmed yet.";
        }
      }

      verify();
      document.getElementById("back").onclick = () => location.href = "/";
    </script>
  </body>
</html>
